name: diagnose-zero
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install curl_cffi
      - run: python3 diagnose_zero.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zero_yield_cause.json targets/institute_sources.json || true
          git commit -m "chore(diag): 0-yield cause $(date -u +%F)" || echo nochange
          for i in 1 2 3; do git pull --rebase --autostash origin main || true; git push && break || sleep 5; done
