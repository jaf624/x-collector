name: src-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe new hardnews sources via Jina
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: python3 src_probe.py
