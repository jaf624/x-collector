name: probe-intel
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe social reachability and watch-search recall via Jina
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: python3 probe_intel.py
