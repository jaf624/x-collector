name: twapi-active-collect

# 通过 TwitterAPI.io 主动采集（关键词搜索 + 指定账号时间线）。
# 按量计费，故频率设为每 6 小时一次；也可在 Actions 页面手动 Run。
on:
  schedule:
    - cron: "17 */6 * * *"   # 每6小时一次（UTC，错峰避开整点）
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Active collect via TwitterAPI.io
        env:
          TWAPI_IO_KEY: ${{ secrets.TWAPI_IO_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python twapi.py

      - name: Commit feed
        run: |
          git config user.name "x-collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(twapi): active feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "无新增"
          fi
