name: intel-selftest
on:
  workflow_dispatch: {}
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Intel pipeline feasibility (reader markdown + fresh search)
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: python3 intel_selftest.py
