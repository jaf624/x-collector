name: free-discover

# 完全免费的 X 主动发现：必应 + DuckDuckGo 搜索出博主/关键词最新推文链接，
# 再用免登录 syndication 接口取正文与图文。零 Key / 零登录 / 零支付，海外 runner 直连。
# 每 3 小时一轮，也可在 Actions 页手动 Run。发现的 ID 持久化在 data/discovered_ids.json。
on:
  schedule:
    - cron: "44 */3 * * *"   # 每 3 小时一次（UTC，与其它工作流错峰）
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover via search engines + fetch via syndication
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          FREE_DISCOVER_MAX: "60"
        run: python free_discover.py

      - name: Commit feed
        run: |
          git config user.name "x-collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(free-discover): feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push
          else
            echo "无新增"
          fi
