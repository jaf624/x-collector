name: gnews-topic
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}
jobs:
  gnews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Google News RSS 按细分题材全网检索
        run: python3 gnews_topic.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intel_feed.json
          if ! git diff --staged --quiet; then
            git commit -m "data: gnews topic feed update"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "push retry $i"; sleep 6; }
            done
          else
            echo "无新增"
          fi
