name: feed-discover
on:
  workflow_dispatch: {}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi
      - run: python3 feed_discover.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets/institute_sources.json data/feed_discovery.json
          git commit -m "chore(sources): feed discovery $(date -u +%F)" || echo nochange
          for i in 1 2 3; do git pull --rebase --autostash origin main || true; git push && break || sleep 5; done
