name: telegram-watch
on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch: {}
jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect public Telegram channels via t.me/s (no login, no media download)
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: python3 telegram_collect.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "data: telegram public channel watch update"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "push retry $i"; sleep 6; }
            done
          else
            echo "本轮无新增（中性自测频道不命中风险词属正常）"
          fi
