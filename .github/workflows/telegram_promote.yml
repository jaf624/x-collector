name: telegram-promote
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Weekly tiered review of pending channels (no login, no join)
        run: python3 telegram_promote.py
      - name: Commit review decisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets/telegram.json data/tg_promotions.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(tg): weekly channel tier review"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "push retry $i"; sleep 6; }
            done
          else
            echo "审核结果无变化"
          fi
