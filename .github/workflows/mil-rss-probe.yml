name: mil-rss-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe .mil DNN RSS parameter variants
        run: python3 probe_mil_rss.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mil_rss_probe.json
          git diff --cached --quiet || git commit -m "probe: mil DNN RSS parameter variants"
          git push origin main
