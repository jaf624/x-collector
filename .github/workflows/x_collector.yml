name: x-collector

# 海外runner定时采集X；也可在 Actions 页面手动 Run workflow
on:
  schedule:
    - cron: "53 */6 * * *"   # 每6小时一次（UTC，错峰；负责免登录投喂链接 + GitHub提示词）
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # 允许把采集结果 commit 回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt || true   # twikit 可选，失败不阻断免登录取数

      - name: Collect X (免登录投喂链接)
        run: python collect.py
      # 登录态主动采集统一由 auth-login-collect(auth_collect.py) 负责，避免旧同步逻辑与 twikit2.x 冲突

      - name: Collect GitHub prompts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python gh_search.py

      - name: Commit feed
        run: |
          git config user.name "x-collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): auto feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "无新增"
          fi
