name: x-collector

# 海外runner定时采集X；也可在 Actions 页面手动 Run workflow
on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟（UTC，即北京时间每小时整点/半点）
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # 允许把采集结果 commit 回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt || true   # twikit 可选，失败不阻断免登录取数

      - name: Collect X
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}   # 可选：配置后可自动抓账号/搜索
          X_CT0:        ${{ secrets.X_CT0 }}
        run: python collect.py

      - name: Commit feed
        run: |
          git config user.name "x-collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): auto feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "无新增"
          fi
