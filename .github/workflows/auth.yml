name: auth-login-collect

# 登录态主动采集（twikit 异步）：凭 X_AUTH_TOKEN + X_CT0 抓博主时间线+关键词搜索。
# 不在机房登录、只带凭证调接口，随机限速保号。每3小时一次，也可手动 Run。
on:
  schedule:
    - cron: "11 */3 * * *"   # 每3小时一次（UTC，错峰）
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Auth collect via twikit
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python auth_collect.py

      - name: Commit feed
        run: |
          git config user.name "x-collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(auth): login feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push
          else
            echo "无新增"
          fi
