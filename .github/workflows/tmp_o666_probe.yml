name: tmp-o666-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== DNS =="
          getent hosts onion666.com || echo "getent: no result"
          nslookup onion666.com 8.8.8.8 2>&1 | tail -6 || true
          echo "== variants =="
          for u in "https://www.onion666.com/" "http://onion666.com/" "https://onion666.com/index.html"; do
            code=$(curl -sL --max-time 15 -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "$u" || echo ERR)
            echo "$u -> $code"
          done
