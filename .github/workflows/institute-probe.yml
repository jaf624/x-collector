name: institute-probe
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # 每天UTC 3点跑一次（北京时间11点）
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe institute sources health
        env:
          PROBE_TIMEOUT: "15"
          PROBE_WORKERS: "20"
        run: python3 probe_institute.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add targets/institute_sources.json data/institute_probe_report.json
          git diff --cached --quiet || git commit -m "probe: institute source health check update"
          git push origin main
