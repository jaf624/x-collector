name: jina-selftest
on:
  workflow_dispatch: {}
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Jina key self-test (search X + reader X)
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: python3 jina_selftest.py
