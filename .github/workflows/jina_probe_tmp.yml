name: jina-probe-tmp
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          key = os.environ.get("JINA_KEY","")
          out = {"key_present": bool(key.strip()), "key_len": len(key.strip())}
          for name, url in [("jina_root","https://r.jina.ai/"), ("reuters","https://www.reuters.com/")]:
              try:
                  req = urllib.request.Request(url, headers={"Authorization":"Bearer "+key.strip()})
                  r = urllib.request.urlopen(req, timeout=20)
                  out[name] = r.status
              except Exception as e:
                  out[name] = repr(e)[:120]
          try:
              req = urllib.request.Request("https://r.jina.ai/https://www.reuters.com/", headers={"Authorization":"Bearer "+key.strip()})
              b = urllib.request.urlopen(req, timeout=40).read().decode("utf-8","ignore")
              out["jina_fetch_len"] = len(b)
          except Exception as e:
              out["jina_fetch"] = repr(e)[:120]
          json.dump(out, open("data/jina_probe.json","w"), ensure_ascii=False)
          EOF
      - run: |
          git config user.name bot && git config user.email bot@local
          git add data/jina_probe.json && git commit -m "probe" && git push
