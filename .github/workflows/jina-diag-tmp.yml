name: jina-diag-tmp
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Jina balance headers and endpoints
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: |
          echo "===== 1) 带key 402响应头（看是否含余额/账单） ====="
          curl -s -D /tmp/h.txt -o /tmp/b.txt -w "HTTP=%{http_code}\n" \
            -H "Authorization: Bearer $JINA_KEY" "https://r.jina.ai/https://example.com"
          echo "--- 响应头 ---"; cat /tmp/h.txt
          echo "--- 响应体前300 ---"; head -c 300 /tmp/b.txt; echo; echo
          echo "===== 2) 匿名200响应头（看ratelimit额度） ====="
          curl -s -D /tmp/h2.txt -o /dev/null -w "HTTP=%{http_code}\n" "https://r.jina.ai/https://example.com"
          cat /tmp/h2.txt; echo
          echo "===== 3) 探测可能的余额/用户端点 ====="
          for ep in "https://api.jina.ai/v1/user" "https://api.jina.ai/v1/balance" \
                    "https://api.jina.ai/balance" "https://r.jina.ai/balance"; do
            code=$(curl -s -o /tmp/e.txt -w "%{http_code}" -H "Authorization: Bearer $JINA_KEY" "$ep")
            echo "[$code] $ep"; head -c 200 /tmp/e.txt; echo; echo
          done
