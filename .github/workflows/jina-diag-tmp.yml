name: jina-diag-tmp
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous real-URL test
        run: |
          for u in \
            "https://news.usni.org/2026/10/30/western-pacific-pulse-oct-30-2026" \
            "https://www.bbc.com/zhongwen/simp" \
            "https://thediplomat.com/" ; do
            echo "===== 匿名抓 $u ====="
            curl -s -o /tmp/x.txt -w "HTTP=%{http_code} 字节=%{size_download}\n" "https://r.jina.ai/$u"
            echo "正文前150字:"; head -c 150 /tmp/x.txt; echo; echo
          done
          echo "===== 匿名 s.jina.ai 搜索 ====="
          curl -s -o /tmp/s.txt -w "HTTP=%{http_code} 字节=%{size_download}\n" "https://s.jina.ai/China%20security?num=2"
          head -c 200 /tmp/s.txt; echo
