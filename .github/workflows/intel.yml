name: intel-watch
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      rss_only:
        description: "勾选后仅跑RSS直连（零token轻量验证，不做搜索/深抓Jina）"
        type: boolean
        default: false
jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe authoritative RSS feeds
        run: python3 rss_probe.py
      - name: Collect OFAC/BIS official government actions
        run: python3 gov_action_collect.py
      - name: International China-risk public news aggregation via Jina
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INTEL_RSS_ONLY: ${{ github.event.inputs.rss_only == 'true' && '1' || '' }}
          INTEL_FORCE_SEARCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rss_only != 'true' && '1' || '' }}
        run: python3 intel_collect.py
      - name: Commit feed
        run: |
          bash commit_feed.sh 'data: intel watch feed update and rss probe'
