name: hard-feed-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe hard (sanctions/export/military) RSS feeds
        run: python3 probe_hard_feed.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hard_feed_probe.json
          git diff --cached --quiet || git commit -m "probe: hard feed availability results"
          git push origin main
