name: telegram-discover-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe public-channel discovery via search engines (no login, no body stored)
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: python3 telegram_discover_probe.py
