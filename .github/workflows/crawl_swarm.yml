name: crawl-swarm
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: crawl-swarm
  cancel-in-progress: false
jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: crawl shard (只收最近24小时)
        run: python crawl/crawl_shard.py --shard ${{ matrix.shard }} --total 8 --n 60 --hours 24 --body-max 30 --sources crawl/sources.json --out out/crawl_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: crawl-shard-${{ matrix.shard }}
          path: out/crawl_${{ matrix.shard }}.json
