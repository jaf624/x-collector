name: translate-backfill
on:
  workflow_dispatch: {}
  schedule:
    # 每2小时自动补译 tier0 英文硬新闻（矿业/能源/军事/官方），与主采集(每30分钟)形成双保险
    - cron: "7 */2 * * *"
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backfill Chinese translation for English hard news
        env:
          INTEL_TX_TIER: "0"
          INTEL_MAX_TRANSLATE: "6"
        run: python3 translate_backfill.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "data: backfill zh translation for english hard news"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "push retry $i"; sleep 6; }
            done
          else
            echo "无新增内容"
          fi
