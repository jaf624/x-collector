name: jina-discover
on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch: {}
jobs:
  jina:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Jina free-API discover + syndication fetch
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 jina_collect.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "data: jina discover feed update"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "push retry $i"; sleep 6; }
            done
          else
            echo "无新增内容"
          fi
