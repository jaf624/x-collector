name: source-liveness
on:
  workflow_dispatch: {}
  schedule:
    - cron: "13 3 * * 1"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 source_liveness.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets/institute_sources.json data/source_liveness.json
          git commit -m "chore(sources): liveness probe $(date -u +%F)" || echo nochange
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push && break || sleep 5
          done
