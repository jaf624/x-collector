name: rss-watch
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Institute RSS only (zero Jina search)
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INTEL_RSS_ONLY: "1"
        run: python3 intel_collect.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "data: rss watch feed update"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "retry $i"; sleep 6; }
            done
          else
            echo "no new content"
          fi
