name: free-nitter-collect

# 免费、免登录主动采集：Nitter 镜像 RSS 发现推文ID + syndication 补全图文。
# 不花 API 费、不登录 X 账号。每 3 小时一次，也可在 Actions 页面手动 Run。
on:
  schedule:
    - cron: "23 */3 * * *"   # 每3小时一次（UTC，错峰）
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free collect (Nitter + syndication)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python free_collect.py

      - name: Commit feed
        run: |
          git config user.name "x-collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(free): nitter feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push
          else
            echo "无新增"
          fi
