name: resolve-fetch
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */3 * * *"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests trafilatura
      - run: python3 resolve_and_fetch.py
        env:
          RESOLVE_MAX: "60"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "data: resolve gnews links + fetch bodies"
            for i in 1 2 3; do git pull --rebase origin main && git push && break || { echo retry $i; sleep 6; }; done
          else
            echo "无变化"
          fi
